[package]
name = "mdcore"
version.workspace = true
edition.workspace = true
description = "Platform-independent core of MarkdownEditor: parsing, rendering, highlighting, editing assists, completion, PDF export"

[dependencies]
comrak = { version = "0.59", default-features = false }
pdf-writer = "0.15"
png = "0.18"
miniz_oxide = "0.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
