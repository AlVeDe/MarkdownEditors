<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MarkdownEditor</title>
<script>
  // Platform class before first paint: macOS gets the unified title bar
  // (room for the traffic lights). The init payload confirms it later.
  document.documentElement.dataset.platform = /Mac/.test(navigator.platform || navigator.userAgent) ? 'macos'
    : /Win/.test(navigator.platform || navigator.userAgent) ? 'windows' : 'linux';
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="preload">

<header id="toolbar" data-tauri-drag-region="deep">
  <div class="tb-lead">
    <button class="tb" id="tb-outline" data-cmd="toggle_outline" data-tip="Outline" data-key="Ctrl+Cmd+S|Ctrl+Alt+S"><svg class="sym"><use href="#i-sidebar"/></svg></button>
    <button class="doc-title" id="doc-title" data-menu="document" title="Document">
      <span class="name" id="doc-name">Untitled</span>
      <span class="edited" id="doc-edited" hidden>Edited</span>
      <svg class="sym chev"><use href="#i-chevron-down"/></svg>
    </button>
  </div>

  <div class="tb-center" id="format-tools">
    <div class="tb-group capsule" data-priority="3">
      <button class="tb" data-cmd="open" data-tip="Open…" data-key="Mod+O"><svg class="sym"><use href="#i-folder"/></svg></button>
      <button class="tb" data-cmd="save" data-tip="Save" data-key="Mod+S"><svg class="sym"><use href="#i-save"/></svg></button>
      <button class="tb" data-cmd="export_pdf" data-tip="Export as PDF…" data-key="Alt+Mod+E"><svg class="sym"><use href="#i-doc-badge"/></svg></button>
    </div>
    <div class="tb-group" data-priority="2">
      <button class="tb dd" data-menu="heading" data-tip="Paragraph Style"><svg class="sym"><use href="#i-textformat"/></svg></button>
    </div>
    <div class="tb-group capsule" data-priority="1">
      <button class="tb" data-cmd="fmt:bold" data-tip="Bold" data-key="Mod+B"><svg class="sym"><use href="#i-bold"/></svg></button>
      <button class="tb" data-cmd="fmt:italic" data-tip="Italic" data-key="Mod+I"><svg class="sym"><use href="#i-italic"/></svg></button>
      <button class="tb" data-cmd="fmt:strikethrough" data-tip="Strikethrough" data-key="Shift+Mod+X"><svg class="sym"><use href="#i-strikethrough"/></svg></button>
      <button class="tb" data-cmd="fmt:highlight" data-tip="Highlight" data-key="Shift+Mod+H"><svg class="sym"><use href="#i-highlighter"/></svg></button>
      <button class="tb" data-cmd="fmt:inlineCode" data-tip="Inline Code" data-key="Ctrl+`"><svg class="sym"><use href="#i-code"/></svg></button>
    </div>
    <div class="tb-group capsule" data-priority="5">
      <button class="tb" data-cmd="fmt:link" data-tip="Link" data-key="Mod+K"><svg class="sym"><use href="#i-link"/></svg></button>
      <button class="tb" data-cmd="fmt:image" data-tip="Image"><svg class="sym"><use href="#i-photo"/></svg></button>
      <button class="tb" data-cmd="fmt:footnote" data-tip="Footnote"><svg class="sym"><use href="#i-footnote"/></svg></button>
    </div>
    <div class="tb-group capsule" data-priority="4">
      <button class="tb" data-cmd="fmt:bulletList" data-tip="Bulleted List" data-key="Shift+Mod+8"><svg class="sym"><use href="#i-list-bullet"/></svg></button>
      <button class="tb" data-cmd="fmt:numberedList" data-tip="Numbered List" data-key="Shift+Mod+7"><svg class="sym"><use href="#i-list-number"/></svg></button>
      <button class="tb" data-cmd="fmt:taskList" data-tip="Task List" data-key="Shift+Mod+9"><svg class="sym"><use href="#i-checklist"/></svg></button>
      <button class="tb" data-cmd="fmt:quote" data-tip="Quote" data-key="Alt+Mod+'"><svg class="sym"><use href="#i-quote"/></svg></button>
    </div>
    <div class="tb-group capsule" data-priority="6">
      <button class="tb dd" data-menu="code" data-tip="Code Block"><svg class="sym"><use href="#i-curlybraces"/></svg></button>
      <button class="tb dd" data-menu="table" data-tip="Table"><svg class="sym"><use href="#i-table"/></svg></button>
      <button class="tb dd" data-menu="math" data-tip="Math"><svg class="sym"><use href="#i-function"/></svg></button>
      <button class="tb" data-cmd="fmt:mermaid" data-tip="Mermaid Diagram"><svg class="sym"><use href="#i-diagram"/></svg></button>
      <button class="tb" data-cmd="fmt:horizontalRule" data-tip="Horizontal Rule"><svg class="sym"><use href="#i-rule"/></svg></button>
    </div>
    <div class="tb-group capsule" data-priority="7">
      <button class="tb" data-cmd="fmt:superscriptText" data-tip="Superscript" data-key="Ctrl+Cmd+=|Ctrl+Alt+="><svg class="sym"><use href="#i-superscript"/></svg></button>
      <button class="tb" data-cmd="fmt:subscriptText" data-tip="Subscript" data-key="Ctrl+Cmd+-|Ctrl+Alt+-"><svg class="sym"><use href="#i-subscript"/></svg></button>
      <button class="tb" data-cmd="fmt:outdent" data-tip="Outdent" data-key="Mod+["><svg class="sym"><use href="#i-outdent"/></svg></button>
      <button class="tb" data-cmd="fmt:indent" data-tip="Indent" data-key="Mod+]"><svg class="sym"><use href="#i-indent"/></svg></button>
    </div>
    <div class="tb-group" id="more-group" hidden>
      <button class="tb" data-menu="more" data-tip="More"><svg class="sym"><use href="#i-ellipsis"/></svg></button>
    </div>
  </div>

  <div class="tb-trail">
    <div class="seg" role="radiogroup" aria-label="View">
      <button class="tb" data-cmd="view:editor" data-tip="Editor Only" data-key="Alt+Mod+1"><svg class="sym"><use href="#i-doc-text"/></svg></button>
      <button class="tb" data-cmd="view:split" data-tip="Editor and Preview" data-key="Alt+Mod+2"><svg class="sym"><use href="#i-split"/></svg></button>
      <button class="tb" data-cmd="view:preview" data-tip="Preview Only" data-key="Alt+Mod+3"><svg class="sym"><use href="#i-eye"/></svg></button>
    </div>
    <button class="tb" data-menu="share" data-tip="Export"><svg class="sym"><use href="#i-share"/></svg></button>
  </div>
</header>

<div id="main">
  <aside id="outline" class="collapsed" aria-label="Outline">
    <div class="sidebar-inner">
      <h3>Outline</h3>
      <div id="outline-list"></div>
    </div>
  </aside>
  <div id="panes" class="mode-split">
    <div id="editor-pane">
      <div id="editor" class="numbers">
        <div id="gutter-bg"></div>
        <div class="layer" id="rows"></div>
        <textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="soft"></textarea>
      </div>
      <div id="findbar" hidden>
        <div class="fb-row">
          <label class="search-field">
            <svg class="sym"><use href="#i-magnifier"/></svg>
            <input type="text" id="find-input" placeholder="Find" />
            <span class="count" id="find-count"></span>
          </label>
          <div class="fb-toggles">
            <button class="tb small" id="find-case" title="Match Case">Aa</button>
            <button class="tb small mono" id="find-regex" title="Regular Expression">.*</button>
          </div>
          <div class="seg nav">
            <button class="tb" id="find-prev" title="Previous Match"><svg class="sym"><use href="#i-chevron-up"/></svg></button>
            <button class="tb" id="find-next" title="Next Match"><svg class="sym"><use href="#i-chevron-down"/></svg></button>
          </div>
          <button class="pill" id="find-close" title="Close (Esc)">Done</button>
        </div>
        <div class="fb-row replace-row">
          <label class="search-field">
            <svg class="sym"><use href="#i-chevron-right"/></svg>
            <input type="text" id="replace-input" placeholder="Replace" />
          </label>
          <button class="pill" id="replace-one">Replace</button>
          <button class="pill" id="replace-all">All</button>
        </div>
      </div>
    </div>
    <div id="splitter"></div>
    <div id="preview-pane">
      <iframe id="preview" title="Preview"></iframe>
    </div>
  </div>
</div>

<footer id="statusbar">
  <span class="msg" id="status-msg"></span>
  <span class="spacer"></span>
  <button class="pos" id="status-pos" title="Go to Line…">Ln 1, Col 1</button>
  <span class="dot"></span>
  <span id="status-words">0 words</span>
  <span class="dot"></span>
  <span id="status-chars">0 characters</span>
</footer>

<div id="tooltip" role="tooltip" hidden></div>
<div id="completion" hidden><div class="list" id="completion-list"></div><div class="doc" id="completion-doc" hidden></div></div>
<div id="mathpreview" hidden></div>
<div id="print-root"></div>

<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
