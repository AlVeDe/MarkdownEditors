name: MarkdownEditor (Rust)

on:
  push:
    paths: ["src/MarkdownEditorRust/**", ".github/workflows/rust-app.yml"]
  pull_request:
    paths: ["src/MarkdownEditorRust/**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/MarkdownEditorRust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/MarkdownEditorRust
      - name: Core tests
        run: cargo test -p mdcore
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installers
        working-directory: src/MarkdownEditorRust/app
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownEditor-${{ runner.os }}
          path: |
            src/MarkdownEditorRust/target/release/bundle/**/*.dmg
            src/MarkdownEditorRust/target/release/bundle/**/*.msi
            src/MarkdownEditorRust/target/release/bundle/**/*.exe
            src/MarkdownEditorRust/target/release/bundle/**/*.deb
            src/MarkdownEditorRust/target/release/bundle/**/*.AppImage
            src/MarkdownEditorRust/target/release/bundle/**/*.rpm
